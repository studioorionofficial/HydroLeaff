<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hydroleaf - Microgreens</title>
    <link rel="icon" href="image_14.png">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        body {
            background: radial-gradient(circle at center, #103c26 0%, #06190e 100%);
            color: #ffffff;
            font-family: 'Vazirmatn', sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }
        .lang-switch {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .lang-btn {
            background: transparent;
            border: none;
            color: #a8d5ba;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            font-family: 'Vazirmatn', sans-serif;
            transition: all 0.4s ease;
        }
        .lang-btn.active, .lang-btn:hover {
            background: #2e7d32;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.5);
        }
        .card {
            background: rgba(10, 35, 20, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 35px 25px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .info-box {
            background: rgba(46, 125, 50, 0.15);
            border: 1px solid rgba(76, 175, 80, 0.3);
            padding: 16px 18px;
            border-radius: 18px;
            margin-bottom: 22px;
            width: 100%;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }
        .info-text {
            font-size: 15px;
            color: #d4edda;
            font-weight: 600;
            line-height: 1.6;
        }
        h1 {
            font-size: 28px;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 700;
            color: #ffffff;
        }
        .slogan {
            font-size: 16px;
            color: #a8d5ba;
            margin-bottom: 22px;
            font-weight: 600;
            line-height: 1.6;
        }
        .section-title {
            font-size: 15px;
            color: #c8e6c9;
            margin-bottom: 18px;
            font-weight: 600;
            opacity: 0.95;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }
        .btn {
            background: linear-gradient(135deg, #1b4d3e, #2e7d32);
            color: #ffffff;
            padding: 14px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(46, 125, 50, 0.5);
            background: linear-gradient(135deg, #236350, #388e3c);
        }
        .phone-btn {
            background: linear-gradient(135deg, #114e21, #2e7d32);
        }
        .phone-number {
            direction: ltr;
            display: inline-block;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="lang-switch">

    <script>
        const content = {
            ku: {
                info: "یەکەمین و گەورەترین کێڵگەی بەرهەمهێنانی مایکرۆگرین بە سیستەمی هایدرۆپۆنیک لە کوردستان",
                slogan: "گەورەترین بەها ، لە بچوکترین گەڵا",
                title: "لاپەڕە فەرمییەکانمان لە تۆڕە کۆمەڵایەتییەکان",
                fb: "فەیسبووک",
                insta: "ئینستاگرام",
                tiktok: "تیکتۆک",
                wa: "واتساب",
                dir: "rtl"
            },
            ar: {
                info: "المزرعة الأولى والأكبر لإنتاج الميكروجرين بنظام الزراعة المائية في كردستان",
                slogan: "أعظم قيمة ، في أصغر ورقة",
                title: "صفحاتنا الرسمية على وسائل التواصل الاجتماعي",
                fb: "فيسبوك",
                insta: "انستغرام",
                tiktok: "تيك توك",
                wa: "واتساب",
                dir: "rtl"
            },
            en: {
                info: "The first and largest microgreens production farm using hydroponic systems in Kurdistan",
                slogan: "Greatest value, in the smallest leaf",
                title: "Our Official Social Media Pages",
                fb: "Facebook",
                insta: "Instagram",
                tiktok: "TikTok",
                wa: "WhatsApp",
                dir: "ltr"
            }
        };

        function setLang(lang, event) {
            document.getElementById('info-box-text').innerText = content[lang].info;
            document.getElementById('slogan-text').innerText = content[lang].slogan;
            document.getElementById('title-text').innerText = content[lang].title;
            document.getElementById('fb-text').innerText = content[lang].fb;
            document.getElementById('insta-text').innerText = content[lang].insta;
            document.getElementById('tiktok-text').innerText = content[lang].tiktok;
            document.getElementById('wa-text').innerText = content[lang].wa;
            document.documentElement.setAttribute('dir', content[lang].dir);
            
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            if(event) {
                event.target.classList.add('active');
            }
        }
    </script>
